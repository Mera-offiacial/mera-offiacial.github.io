name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # ทุก 10 นาที: ดึงข้อมูลสินค้า/แบนเนอร์ล่าสุดจาก Apps Script มาเก็บเป็นไฟล์บนเว็บ
  # (ขึ้นเว็บใหม่เฉพาะตอนข้อมูลเปลี่ยน)
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  CATALOG_URL: https://script.google.com/macros/s/AKfycbyLpV_gCumuBu616iKD8eA7PvwiaHMRX21nY0ePnDGuh9YyQ_NJBfh46pgsf9IRhH1vQg/exec
  CHECKOUT_URL: https://script.google.com/macros/s/AKfycbxjl814hxTjMaWNE0XYW9RSrfop63fTR6GYQlKcjGBxW4R4tlHPYxwJdTCUOEN8gW5Q/exec
  SITE_URL: https://meraofficial.co
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: mkdir _site && unzip -q meracatalogue-site.zip -d _site && touch _site/.nojekyll
      - name: Add data snapshot from repo (if any)
        run: if [ -d data ]; then mkdir -p _site/data && cp -r data/. _site/data/; fi
      - name: Fetch latest data from Apps Script
        id: data
        run: |
          mkdir -p _site/data
          ok=0
          # ข้อมูลสินค้า (GET)
          if curl -fsSL --retry 2 --max-time 90 "$CATALOG_URL?t=$(date +%s)" -o /tmp/catalog.json \
             && jq -e 'type == "object" and (.products | length > 0)' /tmp/catalog.json > /dev/null; then
            cp /tmp/catalog.json _site/data/catalog.json; ok=1
          else
            echo "::warning::ดึงข้อมูลสินค้าไม่สำเร็จ ใช้ข้อมูลเดิม"
            curl -fsSL --max-time 30 "$SITE_URL/data/catalog.json" -o _site/data/catalog.json || rm -f _site/data/catalog.json
          fi
          # แบนเนอร์และข้อความ (POST · ไม่ใส่ -X เพื่อให้ redirect ของ Apps Script เปลี่ยนเป็น GET)
          if curl -fsSL --retry 2 --max-time 90 -H 'Content-Type: text/plain;charset=utf-8' \
               --data '{"action":"content"}' "$CHECKOUT_URL" -o /tmp/content.json \
             && jq -e '.ok == true and (.banners | type == "array")' /tmp/content.json > /dev/null; then
            cp /tmp/content.json _site/data/content.json
          else
            echo "::warning::ดึงแบนเนอร์ไม่สำเร็จ ใช้ข้อมูลเดิม"
            curl -fsSL --max-time 30 "$SITE_URL/data/content.json" -o _site/data/content.json || rm -f _site/data/content.json
          fi
          # รอบตั้งเวลา: ขึ้นเว็บใหม่เฉพาะตอนข้อมูลต่างจากที่อยู่บนเว็บ (ไม่นับเวลา updatedAt)
          changed=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            changed=false
            for f in catalog content; do
              [ -f "_site/data/$f.json" ] || continue
              live=$(curl -fsSL --max-time 30 "$SITE_URL/data/$f.json?t=$(date +%s)" | jq -cS 'del(.updatedAt)' 2>/dev/null || echo none)
              new=$(jq -cS 'del(.updatedAt)' "_site/data/$f.json")
              [ "$live" = "$new" ] || changed=true
            done
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "catalog_ok=$ok changed=$changed"
      - name: Track first-seen dates for the NEW tag
        if: steps.data.outputs.changed == 'true'
        run: |
          # data/new.json = วันที่สินค้าแต่ละตัวขึ้นเว็บครั้งแรก (หน้าเว็บโชว์ป้าย NEW 14 วัน)
          # อ่านของเดิมจากเว็บ · ถ้ายังไม่เคยมี (404) ใช้ tools/new-seed.json · ถ้าโหลดไม่ได้ด้วยเหตุอื่น หยุดไม่ขึ้นเว็บ (กันวันที่หาย)
          code=$(curl -sS --max-time 30 -o /tmp/new_prev.json -w '%{http_code}' "$SITE_URL/data/new.json?t=$(date +%s)" || echo 000)
          if [ "$code" = "404" ]; then cp tools/new-seed.json /tmp/new_prev.json
          elif [ "$code" != "200" ]; then echo "::error::โหลด data/new.json ไม่ได้ ($code)"; exit 1; fi
          [ -f _site/data/catalog.json ] || { cp /tmp/new_prev.json _site/data/new.json; exit 0; }
          python3 - <<'PY'
          import json, re, datetime
          norm = lambda s: re.sub(r'\s+', ' ', str(s or '').strip().lower())
          # ฐาน = tools/new-seed.json · ทับด้วยของบนเว็บ · สินค้า/สีที่ยังไม่มี = วันนี้ · ทับด้วย tools/new-manual.json (ตั้งเอง)
          prev = json.load(open('tools/new-seed.json')).get('products', {})
          prev.update(json.load(open('/tmp/new_prev.json')).get('products', {}))
          cat = json.load(open('_site/data/catalog.json'))
          today = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=7)).strftime('%Y-%m-%d')
          added = 0
          for p in cat.get('products', []):
              k = norm(p.get('brand')) + '|' + norm(p.get('name'))
              keys = [k] + [k + '|' + norm(v.get('color')) for v in p.get('variants', []) if str(v.get('color') or '').strip()]
              for kk in keys:
                  if kk not in prev: prev[kk] = today; added += 1
          try: prev.update(json.load(open('tools/new-manual.json')).get('products', {}))
          except FileNotFoundError: pass
          json.dump({'products': prev}, open('_site/data/new.json', 'w'), ensure_ascii=False)
          print('new products/colours today:', added)
          PY
      - name: Mirror Google Drive images onto the site
        if: steps.data.outputs.changed == 'true'
        run: |
          # ก๊อปรูปจาก Google Drive (lh3) มาไว้ที่ gimg/ ของเว็บเรา · หน้าเว็บโหลดจากเว็บเราแทน Drive
          # (บางเครื่อง เช่น เบราว์เซอร์ในแอป IG โหลดรูปจาก Drive ไม่ขึ้น) · รูปไหนก๊อปไม่ได้ หน้าเว็บใช้ลิงก์ Drive เหมือนเดิม
          python3 - <<'PY'
          import json, os, re, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          txt = ''
          for f in ('_site/data/catalog.json', '_site/data/content.json'):
              if os.path.exists(f): txt += open(f, encoding='utf-8').read()
          ids = sorted(set(re.findall(r'https://lh3\.googleusercontent\.com/d/([A-Za-z0-9_-]{10,})', txt)))
          os.makedirs('_site/gimg', exist_ok=True)
          EXT = {'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif'}
          def get(id_, w):
              req = urllib.request.Request('https://lh3.googleusercontent.com/d/%s=w%d' % (id_, w), headers={'User-Agent': 'Mozilla/5.0 (Mera catalog image mirror)'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  ct = (r.headers.get('Content-Type') or '').split(';')[0].strip()
                  if r.status != 200 or ct not in EXT: raise ValueError(ct)
                  return EXT[ct], r.read()
          def one(id_):
              try:
                  ext, s = get(id_, 400); _, l = get(id_, 1200)
                  open('_site/gimg/%s-s.%s' % (id_, ext), 'wb').write(s)
                  open('_site/gimg/%s-l.%s' % (id_, ext), 'wb').write(l)
                  return id_, ext
              except Exception as e:
                  print('skip', id_, e); return id_, None
          with ThreadPoolExecutor(6) as ex: res = list(ex.map(one, ids))
          ok = {i: e for i, e in res if e}
          json.dump({'ids': ok}, open('_site/data/gimg.json', 'w'))
          print('mirrored %d / %d images' % (len(ok), len(ids)))
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.data.outputs.changed == 'true'
